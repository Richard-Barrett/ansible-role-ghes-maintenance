---
name: "Build role archive"

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: make deps

      - name: Build distributable role archive
        run: |
          make package
          test -s dist/ansible-role-ghes-maintenance.tar.gz
          tar -tzf dist/ansible-role-ghes-maintenance.tar.gz
