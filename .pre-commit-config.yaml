---
minimum_pre_commit_version: "3.7.0"
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=1024
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types:
          - yaml
        require_serial: true

      - id: ansible-lint
        name: ansible-lint
        entry: ansible-lint
        language: system
        files: >-
          (?x)^(defaults|handlers|meta|molecule|tasks|templates|vars|examples)/.*\.(yaml|yml)$
          |^(galaxy|requirements)\.ya?ml$
        pass_filenames: false
        require_serial: true
        stages:
          - pre-push
