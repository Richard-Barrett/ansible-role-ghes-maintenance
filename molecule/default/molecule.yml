---
role_name_check: 2

dependency:
  name: galaxy
  enabled: false

driver:
  name: default

platforms:
  - name: ghes-mock
    options:
      ansible_connection: local

provisioner:
  name: ansible
  inventory:
    host_vars:
      ghes-mock:
        ansible_connection: local
        ansible_async_dir: "/tmp/ansible-role-ghes-maintenance-default/async"
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        ansible_remote_tmp: "/tmp/ansible-role-ghes-maintenance-default-remote"
      localhost:
        ansible_connection: local
        ansible_remote_tmp: "/tmp/ansible-role-ghes-maintenance-default-controller"

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
