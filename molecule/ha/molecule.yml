---
role_name_check: 2

dependency:
  name: galaxy
  enabled: false

driver:
  name: default

platforms:
  - name: ghes-ha-primary
    groups:
      - ghes_primary
    options:
      ansible_connection: local
  - name: ghes-ha-replica-1
    groups:
      - ghes_replicas
    options:
      ansible_connection: local
  - name: ghes-ha-replica-2
    groups:
      - ghes_replicas
    options:
      ansible_connection: local

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        ansible_remote_tmp: "/tmp/ansible-role-ghes-maintenance-ha-remote/{{ inventory_hostname }}"
        ansible_async_dir: "/tmp/ansible-role-ghes-maintenance-ha-async/{{ inventory_hostname }}"
    host_vars:
      localhost:
        ansible_connection: local
        ansible_remote_tmp: "/tmp/ansible-role-ghes-maintenance-ha-controller"

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
