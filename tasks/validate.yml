---
- name: Require explicit upgrade confirmation
  ansible.builtin.assert:
    that:
      - ghes_upgrade_confirm | bool
    fail_msg: >-
      Refusing to upgrade. Set ghes_upgrade_confirm=true only during an approved
      maintenance window.

- name: Validate supported topology
  ansible.builtin.assert:
    that:
      - ghes_upgrade_topology in ['standalone', 'ha_primary', 'ha_replica']
    fail_msg: >-
      This role supports standalone appliances and orchestrated HA primary or
      replica nodes. GHES clusters require the cluster-specific procedure.

- name: Require the HA workflow for replica upgrades
  ansible.builtin.assert:
    that:
      - ghes_upgrade_ha_orchestrated | bool
      - not (ghes_upgrade_manage_maintenance | bool)
      - not (ghes_upgrade_validate_replication | bool)
    fail_msg: >-
      HA replicas must be upgraded by the documented HA orchestration workflow.
      Set ghes_upgrade_ha_orchestrated=true, ghes_upgrade_manage_maintenance=false,
      and ghes_upgrade_validate_replication=false in the serial replica play.
  when: ghes_upgrade_topology == 'ha_replica'

- name: Require externally managed state during an orchestrated primary upgrade
  ansible.builtin.assert:
    that:
      - not (ghes_upgrade_manage_maintenance | bool)
      - not (ghes_upgrade_validate_replication | bool)
    fail_msg: >-
      The HA prepare/finalize phases own maintenance and replication state.
      Set ghes_upgrade_manage_maintenance=false and
      ghes_upgrade_validate_replication=false for the primary upgrade.
  when:
    - ghes_upgrade_topology == 'ha_primary'
    - ghes_upgrade_ha_orchestrated | bool

- name: Require target version
  ansible.builtin.assert:
    that:
      - ghes_upgrade_target_version | length > 0
    fail_msg: "Set ghes_upgrade_target_version, for example 3.21.1."

- name: Require backup confirmation
  ansible.builtin.assert:
    that:
      - not (ghes_upgrade_require_backup_confirmation | bool) or (ghes_upgrade_backup_confirmed | bool)
    fail_msg: "A recent successful GHES backup must be confirmed before upgrade."

- name: Require snapshot confirmation
  ansible.builtin.assert:
    that:
      - not (ghes_upgrade_require_snapshot_confirmation | bool) or (ghes_upgrade_snapshot_confirmed | bool)
    fail_msg: "A current VM snapshot must be confirmed before upgrade."

- name: Validate package source
  ansible.builtin.assert:
    that:
      - (ghes_upgrade_package_local_path | length > 0) or (ghes_upgrade_package_remote_path | length > 0)
    fail_msg: "Set a local package path or an existing remote package path."
